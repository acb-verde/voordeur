<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>2becology</title>
<style>
  @font-face{font-family:"Newsreader";font-weight:500;font-style:italic;font-display:swap;src:url("newsreader-latin-500-italic.woff2") format("woff2")}
  @font-face{font-family:"IBM Plex Mono";font-weight:500;font-style:normal;font-display:swap;src:url("IBMPlexMono-Medium.woff2") format("woff2")}
  :root{
    --papier:#072033; --letters:#EAF2F8; --bijtekst:#A8C2D6; --lijn:#1A5480;
    --accent:#59B3E8; --accent-sterk:#A8D8F5;
    --f-display:"Newsreader",Georgia,serif;
    --f-body:system-ui,-apple-system,"Segoe UI",sans-serif;
    --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:
      linear-gradient(180deg,rgba(4,10,20,.50) 0%,rgba(4,10,20,.22) 32%,rgba(4,10,20,0) 56%,rgba(4,10,20,0) 76%,rgba(4,10,20,.04) 100%),
      url("hero.jpg") center 66% / cover no-repeat fixed,
      #0B3E66;
    color:var(--letters); font-family:var(--f-body); line-height:1.55;
    display:flex; align-items:center; justify-content:center; padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .kader{
    width:100%; max-width:460px; padding:36px 32px 32px;
    background:rgba(7,32,51,.66); border:1px solid var(--lijn); border-radius:10px;
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
    transition:border-color .15s ease,background-color .15s ease;
  }
  .kader:hover{border-color:var(--accent);background:rgba(7,32,51,.78)}
  h1{margin:0 0 26px;text-align:center;font-family:var(--f-display);font-weight:500;font-style:italic;font-size:2.8rem;line-height:1;letter-spacing:-.02em;color:#fff;text-shadow:0 2px 18px rgba(4,10,20,.55)}
  p{margin:0 0 28px;color:var(--bijtekst)}
  .rij{display:flex;justify-content:center}
  .knop{
    display:inline-block; padding:10px 20px; border:1px solid var(--accent); border-radius:999px;
    color:var(--accent-sterk); text-decoration:none; font-family:var(--f-mono); font-weight:500;
    font-size:.78rem; letter-spacing:.08em; text-transform:uppercase;
    transition:background-color .15s ease,color .15s ease;
  }
  .knop:hover{background:var(--accent);color:var(--papier)}
  .knop:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <main class="kader">
    <h1>Archief</h1>
    <div class="rij"><a class="knop" href="https://archief.2becology.nl">naar het archief</a></div>
  </main>
</body>
</html>
